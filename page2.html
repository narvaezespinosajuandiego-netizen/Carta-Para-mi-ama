<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Recuerdos</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red-deep: #c41e3a;
            --red-medium: #e63946;
            --rose-light: #ffc2d1;
            --rose-soft: #ffe5ec;
            --cream: #fff8f5;
        }

        body {
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom, var(--cream) 0%, var(--rose-soft) 100%);
            padding: 3rem 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 30px 80px rgba(196, 30, 58, 0.15);
            animation: slideIn 1s ease-out;
            border: 2px solid rgba(255, 194, 209, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 400;
            font-style: italic;
            text-align: center;
            background: linear-gradient(135deg, var(--red-deep), var(--red-medium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .photos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .photo-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            border: 5px solid white;
            animation: popIn 0.8s ease-out both;
        }

        .photo-card:nth-child(1) {
            animation-delay: 1s;
        }

        .photo-card:nth-child(2) {
            animation-delay: 1.3s;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-3deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .photo-card:hover {
            transform: scale(1.03);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text-content {
            font-family: 'Lora', serif;
            font-size: 1.3rem;
            line-height: 2;
            color: #444;
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out 1.8s both;
        }

        .text-content p {
            margin-bottom: 1.5rem;
        }

        .text-content em {
            color: var(--red-medium);
            font-weight: 600;
        }

        .decorative-line {
            width: 150px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--red-medium), transparent);
            margin: 2.5rem auto;
            animation: fadeIn 1s ease-out 1.5s both;
        }

        .btn-container {
            text-align: center;
            animation: fadeIn 1s ease-out 2.2s both;
        }

        .btn {
            font-family: 'Raleway', sans-serif;
            padding: 1.2rem 3.5rem;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--red-deep), var(--red-medium));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(196, 30, 58, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(196, 30, 58, 0.4);
        }

        @media (max-width: 768px) {
            .photos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Recuerdo cuando eras pequeño...</h2>

        <div class="photos-grid">
            <div class="photo-card">
                <img src="images/FB_IMG_1773284955171.jpg" alt="Cuando eras niño">
            </div>
            <div class="photo-card">
                <img src="images/FB_IMG_1773284966666.jpg" alt="Contigo de pequeño">
            </div>
        </div>

        <div class="decorative-line"></div>

        <div class="text-content">
            <p>
                Han pasado 8 años desde que te fuiste.<br>
                Yo tenía apenas 10 años.
            </p>
            <p>
                No entendía completamente por qué te ibas,<br>
                solo sabía que <em>algo grande estaba cambiando</em> en nuestras vidas.
            </p>
        </div>

        <div class="decorative-line"></div>

        <div class="btn-container">
            <a href="page3.html" class="btn">Continuar leyendo ❤</a>
        </div>
    </div>

    <audio id="bgMusic" loop autoplay>
        <source src="music/photograph.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        music.volume = 0.4;
        music.play().catch(err => console.log('Audio:', err));
    </script>
</body>
</html>
