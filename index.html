<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mamá</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red-deep: #c41e3a;
            --red-medium: #e63946;
            --rose-light: #ffc2d1;
            --rose-soft: #ffe5ec;
            --cream: #fff8f5;
        }

        body {
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--rose-soft) 0%, var(--cream) 40%, var(--rose-light) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Corazones flotantes */
        .heart-float {
            position: absolute;
            opacity: 0.15;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.15;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(196, 30, 58, 0.2);
            max-width: 600px;
            animation: fadeInScale 1.5s ease-out;
            border: 2px solid rgba(255, 194, 209, 0.4);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 400;
            font-style: italic;
            background: linear-gradient(135deg, var(--red-deep), var(--red-medium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            animation: titleReveal 2s ease-out 0.5s both;
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                letter-spacing: 10px;
            }
            to {
                opacity: 1;
                letter-spacing: normal;
            }
        }

        .date {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s both;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .message {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            color: #444;
            line-height: 2;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 2s both;
        }

        .message em {
            color: var(--red-medium);
            font-style: italic;
        }

        .btn {
            font-family: 'Raleway', sans-serif;
            padding: 1.2rem 3.5rem;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--red-deep), var(--red-medium));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 40px rgba(196, 30, 58, 0.3);
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            animation: fadeIn 1s ease-out 2.5s both;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(196, 30, 58, 0.4);
            background: linear-gradient(135deg, var(--red-medium), var(--red-deep));
        }

        .heart-icon {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 3rem;
            color: var(--red-medium);
            animation: heartbeat 1.5s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>
<body>
    <!-- Corazones flotantes -->
    <div class="heart-float" style="left: 10%; font-size: 2rem; animation-duration: 20s; animation-delay: 0s;">❤</div>
    <div class="heart-float" style="left: 30%; font-size: 1.5rem; animation-duration: 25s; animation-delay: 3s;">❤</div>
    <div class="heart-float" style="left: 50%; font-size: 2.5rem; animation-duration: 22s; animation-delay: 6s;">❤</div>
    <div class="heart-float" style="left: 70%; font-size: 1.8rem; animation-duration: 24s; animation-delay: 2s;">❤</div>
    <div class="heart-float" style="left: 85%; font-size: 2rem; animation-duration: 23s; animation-delay: 5s;">❤</div>

    <div class="heart-icon">❤</div>

    <div class="container">
        <h1>Para Mamá</h1>
        <p class="date">12 de marzo de 2026</p>
        <p class="message">
            Hoy es tu día especial...<br>
            Y tengo algo importante que decirte.<br>
            <br>
            <em>Algo que llevo en el corazón desde hace mucho tiempo.</em>
        </p>
        <a href="page2.html" class="btn">Continuar ❤</a>
    </div>

    <audio id="bgMusic" loop>
        <source src="music/photograph.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.querySelector('.btn').addEventListener('click', function(e) {
            const music = document.getElementById('bgMusic');
            music.volume = 0.4;
            music.play().catch(err => console.log('Audio playback:', err));
        });
    </script>
</body>
</html>
